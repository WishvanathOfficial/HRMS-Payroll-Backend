<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Reset password — HRMS</title>
        <link rel="stylesheet" href="../assets/shared.css" />
        <style>
            body { background: var(--bg-app); min-height: 100vh; display: grid; place-items: center; padding: 40px; }
            .auth-card { width: 440px; padding: 40px; background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
            .logo-big { width: 56px; height: 56px; border-radius: var(--radius-lg); background: linear-gradient(135deg, var(--primary-500), var(--violet-600)); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 24px; margin-bottom: 24px; }
            .strength-bar { height: 6px; background: var(--gray-150); border-radius: 99px; overflow: hidden; margin-top: 6px; }
            .strength-bar > div { height: 100%; border-radius: 99px; transition: all 0.2s; }
            .rule { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 0; }
            .rule.met { color: var(--emerald-600); }
            .rule.unmet { color: var(--text-muted); }
        </style>
    </head>
    <body>
        <div class="auth-card">
            <div class="logo-big">H</div>
            <h1 style="margin: 0; font-size: 24px;">Set a new password</h1>
            <p class="text-muted" style="margin: 8px 0 24px; font-size: 14px;">Resetting password for <strong style="color: var(--text-primary);">diya.patel@company.com</strong></p>

            <div style="display: flex; flex-direction: column; gap: 16px;">
                <div>
                    <label class="text-xs text-muted" style="display: block; margin-bottom: 6px;">New password</label>
                    <input type="password" value="••••••••••••" style="width: 100%; padding: 12px 14px; border: 1px solid var(--border-soft); border-radius: var(--radius-md); font-size: 14px;" />
                    <div class="strength-bar"><div style="width: 75%; background: linear-gradient(90deg, var(--emerald-500), var(--emerald-600));"></div></div>
                    <div class="text-xs" style="margin-top: 4px; color: var(--emerald-600);">Strong</div>
                </div>

                <div>
                    <label class="text-xs text-muted" style="display: block; margin-bottom: 6px;">Confirm new password</label>
                    <input type="password" value="••••••••••••" style="width: 100%; padding: 12px 14px; border: 1px solid var(--border-soft); border-radius: var(--radius-md); font-size: 14px;" />
                </div>

                <div style="padding: 14px; background: var(--gray-50); border-radius: var(--radius-md);">
                    <div class="text-xs text-muted" style="margin-bottom: 8px; font-weight: 600;">PASSWORD MUST CONTAIN</div>
                    <div class="rule met">✓ At least 12 characters</div>
                    <div class="rule met">✓ Upper and lowercase letters</div>
                    <div class="rule met">✓ At least one number</div>
                    <div class="rule met">✓ At least one special character</div>
                    <div class="rule unmet">○ Different from your last 5 passwords</div>
                </div>

                <button class="btn btn-primary" style="width: 100%; padding: 12px;">Update password &amp; sign in</button>
            </div>

            <div style="text-align: center; margin-top: 18px; font-size: 13px;">
                <a href="login.html" style="color: var(--text-muted); text-decoration: none;">Cancel and return to sign in</a>
            </div>
        </div>
    </body>
</html>
