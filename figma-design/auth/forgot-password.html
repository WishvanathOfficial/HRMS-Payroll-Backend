<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Forgot password — HRMS</title>
        <link rel="stylesheet" href="../assets/shared.css" />
        <style>
            body { background: var(--bg-app); min-height: 100vh; display: grid; place-items: center; padding: 40px; }
            .auth-card { width: 420px; padding: 40px; background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
            .logo-big { width: 56px; height: 56px; border-radius: var(--radius-lg); background: linear-gradient(135deg, var(--primary-500), var(--violet-600)); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 24px; margin-bottom: 24px; }
        </style>
    </head>
    <body>
        <div class="auth-card">
            <div class="logo-big">H</div>
            <h1 style="margin: 0; font-size: 24px;">Forgot your password?</h1>
            <p class="text-muted" style="margin: 8px 0 24px; font-size: 14px;">No worries. Enter your work email and we'll send a reset link.</p>

            <div style="display: flex; flex-direction: column; gap: 14px;">
                <div>
                    <label class="text-xs text-muted" style="display: block; margin-bottom: 6px;">Work email</label>
                    <input type="email" placeholder="you@company.com" style="width: 100%; padding: 12px 14px; border: 1px solid var(--border-soft); border-radius: var(--radius-md); font-size: 14px;" />
                </div>
                <button class="btn btn-primary" style="width: 100%; padding: 12px;">Send reset link</button>
            </div>

            <div style="margin-top: 24px; padding: 14px; background: var(--blue-50); border-radius: var(--radius-md); font-size: 13px; display: flex; gap: 10px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--blue-600)" stroke-width="2" style="flex-shrink: 0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <div><strong>Tip:</strong> The reset link expires in 30 minutes. Check your spam folder if you don't see it.</div>
            </div>

            <div style="text-align: center; margin-top: 24px; font-size: 13px;">
                Remember your password? <a href="login.html" style="color: var(--primary-600); font-weight: 600; text-decoration: none;">Back to sign in</a>
            </div>
        </div>
    </body>
</html>
